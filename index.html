<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>那堵墙 · 对话</title>
<style>
  :root {
    --bg: #f5faf7;
    --surface: #ffffff;
    --ink: #22312a;
    --muted: #7c8f86;
    --green: #1d7a52;
    --green-deep: #145c3e;
    --green-soft: #e3f2ea;
    --line: #dcebe3;
    --line-strong: #c8e0d2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(620px 300px at 50% -80px, rgba(29, 122, 82, .10), transparent 70%);
    pointer-events: none;
  }

  .page {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
    padding: 4.2rem 1.5rem 5rem;
  }

  h1 {
    margin: 0 0 .9rem;
    text-align: center;
    font-family: "Songti SC", "Noto Serif CJK SC", "STSong", "SimSun", serif;
    font-size: 2.15rem;
    font-weight: 600;
    letter-spacing: .05em;
    line-height: 1.35;
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    max-width: 560px;
    margin: 0 auto 3.2rem;
  }
  .head-btn {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: .55rem 1.25rem;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: .05em;
    cursor: pointer;
    flex: 0 0 auto;
    transition: background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  .head-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  .head-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  .head-btn:active:not(:disabled) { background: var(--green-soft); }
  .head-btn:disabled { opacity: .32; cursor: not-allowed; }

  .scale {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .45rem;
  }
  .scale .name {
    font-size: .8rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track {
    position: relative;
    display: flex;
    align-items: center;
    gap: .42rem;
    padding: .22rem 0;
  }
  .track::before {
    content: "";
    position: absolute;
    left: 3px;
    right: 3px;
    top: 50%;
    height: 1px;
    background: var(--line-strong);
  }
  .track .dot {
    position: relative;
    z-index: 1;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .track .dot.on {
    background: var(--green);
    border-color: var(--green);
    transform: scale(1.15);
  }
  .caps {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: .68rem;
    letter-spacing: .14em;
    color: var(--muted);
  }

  .date-line,
  .end-line {
    display: flex;
    align-items: center;
    gap: .9rem;
    max-width: 620px;
    margin: 0 auto 2.4rem;
    color: var(--muted);
    font-size: .76rem;
    letter-spacing: .1em;
  }
  .date-line::before,
  .date-line::after,
  .end-line::before,
  .end-line::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .end-line { margin: 0 auto 0; }

  .chat {
    display: flex;
    flex-direction: column;
    gap: 1.6rem;
    max-width: 620px;
    margin: 0 auto;
  }
  .row {
    display: flex;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .32s ease, transform .32s ease;
  }
  .chat.show .row { opacity: 1; transform: none; }
  .row.you { justify-content: flex-start; }
  .row.me { justify-content: flex-end; }
  .talk {
    max-width: 78%;
    min-width: 0;
  }
  .who {
    display: block;
    margin-bottom: .2rem;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .2em;
  }
  .row.you .who { color: var(--muted); }
  .row.me .who { color: var(--green); text-align: right; }
  .row.you p {
    margin: 0;
    font-size: 1.02rem;
    line-height: 1.85;
    color: var(--ink);
  }
  .row.me .bubble {
    background: var(--green-soft);
    border-radius: 14px;
    border-top-right-radius: 4px;
    padding: .7rem .95rem;
    font-size: .98rem;
    line-height: 1.8;
    color: var(--ink);
  }

  .ask {
    display: flex;
    gap: .7rem;
    max-width: 620px;
    margin: 2.6rem auto 0;
  }
  .ask input {
    flex: 1;
    min-width: 0;
    appearance: none;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    padding: .72rem 1.15rem;
    font: inherit;
    font-size: .98rem;
    line-height: 1.5;
    outline: none;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .ask input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(29, 122, 82, .12);
  }
  .ask input::placeholder {
    color: var(--muted);
    opacity: .85;
  }
  .ask .head-btn {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .ask .head-btn:hover:not(:disabled),
  .ask .head-btn:active:not(:disabled) {
    background: var(--green-deep);
    border-color: var(--green-deep);
    color: #fff;
  }

  @media (max-width: 560px) {
    .page { padding: 2.8rem 1.1rem 3.5rem; }
    h1 { font-size: 1.7rem; }
    .controls { gap: .7rem; }
    .scale { order: 3; flex-basis: 100%; }
    .talk { max-width: 88%; }
    .row.you p { font-size: .98rem; }
    .row.me .bubble { font-size: .95rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .row { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<main class="page">
  <h1>那堵墙</h1>

  <div class="controls">
    <button id="btnPro" class="head-btn" type="button">专业+</button>
    <div class="scale" aria-live="polite">
      <span class="name" id="levelName">温和分析</span>
      <span class="track" id="track" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot on"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
      <span class="caps"><span>专业</span><span>简单</span></span>
    </div>
    <button id="btnSimple" class="head-btn" type="button">简单+</button>
  </div>

  <section class="chat show" id="chat" aria-live="polite"></section>

  <div class="ask">
    <input id="q" type="text" placeholder="写下你此刻的困扰，按回车发送" autocomplete="off" aria-label="写下你的困扰">
    <button id="send" class="head-btn" type="button">发送</button>
  </div>
</main>

<script>
const LEVEL_NAMES = ["学术深析", "概念框架", "温和分析", "大白话", "更简单", "极简"];

const QA = [
  {
    keys: ["熬夜", "刷手机", "刷到", "停不下来", "控制不住", "后悔", "很晚"],
    lines: [
      "该行为符合睡眠拖延（bedtime procrastination）的结构：明知后果而延迟就寝。其驱力并非对设备内容的依赖，而是对自主时间的代偿性占有——深夜是全天唯一不受他者要求支配的时段，信息消费构成对个人边界的消极捍卫。",
      "深夜刷手机属于典型的睡眠拖延：明知该睡却不睡。它看起来像手机上瘾，其实是在守住全天唯一属于自己的时间——白天的时间都交出去了，夜里总得讨一点回来。",
      "其实不是手机的问题。深夜是全天唯一没人向你要东西的时间，刷手机是你守住这最后一段属于自己的时间——你抗拒的不是手机，而是这一天几乎全交出去了。",
      "晚上刷手机停不下来，不是手机害你，是你白天的时间都不是自己的。晚上这点时间，你不想再交给任何人。",
      "晚上刷手机停不下来，是因为白天的时间都不是你的。晚上这点，你不想再交出去。",
      "刷手机停不下来，是因为白天的时间都不是你的。"
    ]
  },
  {
    keys: ["该睡", "早点睡", "应该睡", "明明", "舍不得", "睡不着"],
    lines: [
      "“该睡”的冲突源于内在裁判的持续监控；就寝在象征层面意味着一天的终结与让渡。当白昼的自我导向时间不足时，入睡被体验为放弃而非休整，故拖延并非困倦的缺失，而是对“结束这一天”的抗拒。",
      "你心里的“该睡”是一个裁判。睡觉意味着这一天彻底结束、彻底交出，而你还没觉得这一天里有真正属于自己的部分。所以你不是困，是不舍得这一天就这么没了。",
      "“该睡”是心里的裁判在说话。你越催自己，越不想睡，因为一睡，这一天就真的结束了——而你还没觉得这一天里有哪一块是自己的。",
      "你一边刷一边说“该睡了”，心里有个声音在催你、骂你。越骂越睡不着，因为睡了，今天就没有了，可今天好像没有一分钟是为你过的。",
      "你心里一边说“该睡了”，一边骂自己。越骂越不想睡——睡了今天就没，可今天没有一分钟是你的。",
      "一边说该睡，一边骂自己，越骂越不想睡。"
    ]
  },
  {
    keys: ["放下", "戒", "停止", "怎么才能", "怎么办", "改"],
    lines: [
      "行为改变的充分条件并非意志力，而是自主时间的重新分配：当白昼包含足够的自我导向活动，睡前的信息消费便由必需品降级为可选项，放下手机成为自然结果而非自我克制的产物。",
      "放下手机靠的不是意志力，而是白天先给自己留一块真正属于自己的时间。睡前有一件让你觉得“这一天活过”的小事，手机就没那么难放。",
      "靠的不是意志力，是白天先给自己留一点真正属于自己的时间。睡前心里有了着落，手机就没那么大的吸引力了。",
      "想放下手机，别靠硬忍。白天给自己留点想做的事，睡前心里踏实了，手机自然就没那么好玩。",
      "想放下手机，别硬撑。白天给自己留点想做的事，晚上心里踏实，手机就没那么抓人。",
      "想放下，别硬撑。白天留点时间给自己。"
    ]
  },
  {
    keys: ["不是手机", "手机的问题", "为什么", "问题在哪", "根源", "到底"],
    lines: [
      "深夜的刷屏可解读为生活对时间分配失衡的示警：自我导向时间的匮乏使其在夜间以代偿形式回归。手机是廉价的补偿机制，而非问题的根源。",
      "深夜刷手机，是身体在替你喜欢的生活记账：这一天的“自己时间”太少，它只能在夜里讨回来。手机是最便宜的补偿，不是病因。",
      "不是。深夜刷手机，是你喜欢的生活在替它自己记账：这一天的“自己时间”太少了，它只能在夜里讨回来。手机是最省力的补偿，不是病因。",
      "所以别怪手机。它只是在提醒你：白天你为自己活得太少了。",
      "所以别怪手机。它是在说：白天，你为自己活得太少。",
      "别怪手机。它只是提醒你：白天为自己活得太少。"
    ]
  },
  {
    keys: ["白天", "自己的事", "好好睡", "睡得着", "改善", "调整", "改变"],
    lines: [
      "入睡困难的核心并非设备，而是持续的自我评判循环——对熬夜的责备本身延长了清醒。解除该评判，并以白昼的自主时间填补缺口，夜晚即自然松动。问题不在手机，而在时间如何流向自己。",
      "让你睡不着的不是手机，是那个一边催你睡、一边骂你熬夜的声音。把白天过得像是自己的，夜晚自然就松了。",
      "差不多。真正让你睡不着的不是手机，是那个一边催你睡、一边骂你熬夜的声音。把白天过得像是自己的，夜晚自己就会松下来。",
      "让你睡不着的不是手机，是骂自己“又熬夜”的那个声音。白天多为自己活一点，晚上就睡得着了。",
      "让你睡不着的，是骂自己熬夜的声音。白天多为自己活，晚上自然睡得着。",
      "让你睡不着的，是骂自己的声音。白天为自己活，晚上就睡得着。"
    ]
  }
];

const FALLBACK = [
  "你提出的问题暂不在预设应答范围内。就一般意义而言，内耗多源于持续的自我评判与时间导向的失衡；若具体指向深夜刷手机，可尝试询问其成因（如“为什么总熬夜”）或放下策略（如“怎么放下手机”），以便给出对应分析。",
  "这个问题我还没有现成的分析。一般来看，内耗来自自我评判，加上时间没有流向自己；如果你问的是深夜刷手机，可以试试问“为什么总熬夜”或“怎么放下手机”。",
  "你问的这件事，我还不确定怎么接。大概的方向是：内耗多半来自心里的评判，加上时间没有流向自己。如果是深夜刷手机的事，可以问“为什么总熬夜”或“怎么放下手机”。",
  "这个问题我暂时答不上来。先说个大概：内耗通常来自老骂自己，和白天没做自己想做的事。要是问刷手机，就问“为什么总熬夜”或“怎么放下手机”。",
  "这个问题我现在答不好。先说大概：内耗来自骂自己，和时间不是自己的。问手机的事，就问“为什么熬夜”或“怎么放下”。",
  "这个问题先答不了。大概：别骂自己，白天留点时间给自己。问手机，就问熬夜和放下。"
];

const state = { level: 2 };
const conv = [];

const btnPro = document.getElementById("btnPro");
const btnSimple = document.getElementById("btnSimple");
const levelName = document.getElementById("levelName");
const track = document.getElementById("track");
const chat = document.getElementById("chat");
const input = document.getElementById("q");
const sendBtn = document.getElementById("send");

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function matchQA(text) {
  let best = -1, bestScore = 0;
  QA.forEach(function (qa, i) {
    let score = 0;
    qa.keys.forEach(function (key) {
      if (text.indexOf(key) !== -1) score += key.length;
    });
    if (score > bestScore) {
      bestScore = score;
      best = i;
    }
  });
  return best;
}

function answerFor(turn) {
  return turn.qaIndex === -1 ? FALLBACK[state.level] : QA[turn.qaIndex].lines[state.level];
}

function render() {
  const atProEnd = state.level === 0;
  const atSimpleEnd = state.level === LEVEL_NAMES.length - 1;

  levelName.textContent = LEVEL_NAMES[state.level] + (atProEnd ? " · 已到最专业" : atSimpleEnd ? " · 已到最简单" : "");
  track.querySelectorAll(".dot").forEach(function (dot, i) {
    dot.classList.toggle("on", i === state.level);
  });
  btnPro.disabled = atProEnd;
  btnSimple.disabled = atSimpleEnd;

  const rows = [];
  conv.forEach(function (turn, t) {
    rows.push('<div class="row me" style="transition-delay:' + (t * 2 + 1) * 0.045 + 's">' +
      '<div class="talk"><span class="who">我</span><div class="bubble">' + esc(turn.text) + "</div></div></div>");
    rows.push('<div class="row you" style="transition-delay:' + (t * 2 + 2) * 0.045 + 's">' +
      '<div class="talk"><span class="who">你</span><p>' + answerFor(turn) + "</p></div></div>");
  });
  chat.innerHTML = rows.join("");

  chat.classList.remove("show");
  void chat.offsetWidth;
  chat.classList.add("show");
}

function submitQ() {
  const text = input.value.trim();
  if (!text) return;
  conv.push({ text: text, qaIndex: matchQA(text) });
  input.value = "";
  render();
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  input.focus();
}

sendBtn.addEventListener("click", submitQ);

input.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    e.preventDefault();
    submitQ();
  }
});

btnPro.addEventListener("click", function () {
  if (state.level > 0) {
    state.level -= 1;
    render();
  }
});

btnSimple.addEventListener("click", function () {
  if (state.level < LEVEL_NAMES.length - 1) {
    state.level += 1;
    render();
  }
});

render();
</script>
</body>
</html>
